<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEVY // EXERCISE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/exercise.css">

</head>

<body>

    <header class="header">
        <a class="back-btn" href="#" onclick="history.back(); return false;">← Back</a>
        <div class="header-title" id="exTitle">EXERCISE</div>
        <span class="muscle-tag" id="muscleTag" style="display:none"></span>
        <button id="btnTheme" onclick="toggleTheme()" style="margin-left:auto;background:transparent;border:1px solid var(--border);

                padding:6px 12px;cursor:pointer;transition:all 0.15s">☾</button>
    </header>

    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            LOADING EXERCISE...
        </div>

    <script>const NAME = decodeURIComponent("{{ name }}");</script>
