<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEVY / TRAINING LOG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/index.css">

</head>

<body>

    <header class="header">
        <div class="header-left">
            <h1>HEVY // LOG</h1>
            <span class="header-sub">Training Dashboard</span>
        </div>
        <div style="display:flex;align-items:center;gap:20px">
            <div style="display:flex;align-items:center;gap:8px">
                <span style="color:var(--muted);font-size:11px;letter-spacing:1px">BW</span>
                <input id="bwInput" type="number" value="80" min="40" max="150" step="1" style="width:52px;background:transparent;border:1px solid var(--border);
                                     color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;
                                     padding:4px 6px;text-align:center">
                <span style="color:var(--muted);font-size:11px">kg</span>
            </div>

            <div class="cache-badge" id="cacheInfo">—</div>
            <div class="window-btns">
                <button class="btn-window" data-w="1M" onclick="setWindow('1M')">1M</button>
                <button class="btn-window" data-w="3M" onclick="setWindow('3M')">3M</button>
                <button class="btn-window" data-w="1Y" onclick="setWindow('1Y')">1Y</button>
            </div>
            <button class="btn-refresh" id="btnRefresh" onclick="refresh()">↻ Refresh</button>
            <button class="btn-refresh" id="btnTheme" onclick="toggleTheme()" style="padding:8px 12px">☀</button>
        </div>
    </header>

    <div id="app">
        <div class="loading">
            <div class="spinner"></div>LOADING TRAINING DATA...
        </div>
    </div>
    <div class="muscle-tooltip" id="muscleTooltip"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="/static/js/index.js"></script>

</body>

</html>
